<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SEVAKA Recruitment — Import Logs</title>
  <meta name="viewport" content="width=1440">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/colors_and_type.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/notifications.css">
  <link rel="stylesheet" href="css/employee-flows.css?v=2">
  <link rel="stylesheet" href="css/form-standard.css">
  <link rel="stylesheet" href="css/recruitment.css">
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body data-screen-label="Recruitment — Import Logs">

<div class="app">
  <header class="topnav" id="sevakaTopnav"></header>
  <div class="app__body rc-body">
    <aside class="rc-sidebar" id="rcSidebar"></aside>
    <main class="app__main">
      <div class="app__scroll">

        <section class="rc-card">
          <a class="crumb" href="recruitment-job-listings.html">Job Listings</a>
          <h1 class="rc-detail-title">Import logs</h1>

          <div class="rc-logs-bar">
            <div class="ctl ctl--select" id="statusSelect" style="width:200px;flex-shrink:0">
              <span class="ctl__value">All status</span>
              <svg class="ctl__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              <div class="dropdown">
                <button class="dropdown__opt is-sel" data-val="all" type="button">All status</button>
                <button class="dropdown__opt" data-val="completed" type="button">Completed</button>
                <button class="dropdown__opt" data-val="failed" type="button">Failed</button>
                <button class="dropdown__opt" data-val="processing" type="button">In process</button>
              </div>
            </div>
            <button class="rc-refresh" type="button" id="refreshBtn"><i data-lucide="rotate-ccw"></i>Refresh logs</button>
          </div>

          <div class="dtable-wrap dtable-wrap--scroll">
            <table class="dtable rc-logs-table">
              <thead>
                <tr>
                  <th>Import ID</th>
                  <th>Date</th>
                  <th>Uploaded By</th>
                  <th>File Name</th>
                  <th>Job Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="logBody"></tbody>
            </table>
          </div>

          <div class="rc-tfoot">
            <div class="rc-tfoot__left">
              <span>Showing</span>
              <button class="rc-tfoot__select" type="button">10 <i data-lucide="chevron-down"></i></button>
              <span>from <span id="rowCount">3</span> rows</span>
            </div>
            <div class="rc-tfoot__pages">
              <button class="rc-pg" aria-label="prev" disabled><i data-lucide="chevron-left"></i></button>
              <button class="rc-pg" aria-label="first" disabled><i data-lucide="chevrons-left"></i></button>
              <span class="rc-pg-cur">1</span>
              <button class="rc-pg" aria-label="next" disabled><i data-lucide="chevron-right"></i></button>
              <button class="rc-pg" aria-label="last" disabled><i data-lucide="chevrons-right"></i></button>
              <span style="margin-left:6px">from 1</span>
            </div>
          </div>
        </section>

      </div>
    </main>
  </div>
</div>

<script>window.RC_PAGE = { active: 'jobs' };</script>
<script src="js/recruitment-shell.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/flow-common.js?v=4"></script>
<script>
  (function () {
    var LOGS = [
      { id: 'IMP-20260728-014', date: '28 Jul 2026, 14:22', by: 'CP060 - Mitsui Tiga', meta: 'Jakarta | IT Staff - SQA', color: '#d97706', ini: 'MT', file: 'job-listings-batch-3.csv', status: 'completed' },
      { id: 'IMP-20260726-009', date: '26 Jul 2026, 09:41', by: 'CP060 - Mitsui Dua',  meta: 'Jakarta | IT Staff - SQA', color: '#0e9488', ini: 'MD', file: 'q3-openings.csv',          status: 'failed' },
      { id: 'IMP-20260722-002', date: '22 Jul 2026, 16:08', by: 'CP060 - Mitsui Satu', meta: 'Jakarta | IT Staff - SQA', color: '#0284c7', ini: 'MS', file: 'engineering-roles.csv',    status: 'failed' }
    ];
    var ST = {
      completed:  { cls: 'logst--done', label: 'Completed' },
      failed:     { cls: 'logst--fail', label: 'Failed' },
      processing: { cls: 'logst--done', label: 'In process' }
    };
    function render(filter) {
      var rows = LOGS.filter(function (r) { return !filter || filter === 'all' || r.status === filter; });
      document.getElementById('logBody').innerHTML = rows.map(function (r) {
        var st = ST[r.status];
        var href = 'recruitment-import-log-detail.html?status=' + r.status + '&id=' + encodeURIComponent(r.id);
        return '<tr>' +
          '<td class="cell-strong">' + r.id + '</td>' +
          '<td class="cell-dim">' + r.date + '</td>' +
          '<td><span class="rc-uploader"><span class="flt-av" style="background:' + r.color + '">' + r.ini + '</span>' +
            '<span class="rc-uploader__names"><span class="rc-uploader__name">' + r.by + '</span>' +
            '<span class="rc-uploader__meta">' + r.meta + '</span></span></span></td>' +
          '<td class="cell-dim">' + r.file + '</td>' +
          '<td><span class="logst ' + st.cls + '">' + st.label + '</span></td>' +
          '<td><div class="rowacts"><a class="rowbtn" href="' + href + '">View Details</a></div></td>' +
        '</tr>';
      }).join('');
      document.getElementById('rowCount').textContent = rows.length;
      if (window.lucide) window.lucide.createIcons();
    }
    render('all');

    document.getElementById('statusSelect').addEventListener('select', function (e) {
      render(e.detail.value);
    });
    var rb = document.getElementById('refreshBtn');
    rb.addEventListener('click', function () {
      rb.classList.remove('is-spin'); void rb.offsetWidth; rb.classList.add('is-spin');
      window.Flow.toast('Logs refreshed.', 'info');
    });
  })();
</script>
</body>
</html>
